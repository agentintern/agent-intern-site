version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    # A major version needs a person to read what changed.
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      all:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      all:
        patterns: ['*']
